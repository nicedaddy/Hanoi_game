<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2D 마인크래프트 (DOM 버전)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #hud {
      margin-bottom: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #f8fafc;
    }
    #gameGrid {
      display: grid;
      grid-template-columns: repeat(25, 24px);
      grid-template-rows: repeat(18, 24px);
      gap: 1px;
      background-color: #334155;
      border: 4px solid #f1f5f9;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .tile {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
    /* 블록 스타일 */
    .air   { background-color: #60a5fa; }
    .grass { background-color: #22c55e; border-bottom: 3px solid #15803d; }
    .dirt  { background-color: #854d0e; }
    .stone { background-color: #64748b; }
    .coal  { background-color: #0f172a; }
    .wood  { background-color: #451a03; }
    
    .guide {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div id="hud">보유 블록: <span id="blockCount">5</span>개</div>
  <div id="gameGrid"></div>
  <div class="guide">조작: [클릭] 블록 채굴 | [Shift + 클릭] 블록 설치</div>

  <script>
    (function () {
      const COLS = 25;
      const ROWS = 18;
      const grid = document.getElementById('gameGrid');
      const hud = document.getElementById('blockCount');

      let blocks = 5;
      const map = [];

      for (let r = 0; r < ROWS; r++) {
        map[r] = [];
        for (let c = 0; c < COLS; c++) {
          let type = 'air';
          const surface = 8 + Math.round(Math.sin(c * 0.4) * 2);

          if (r === surface) {
            type = 'grass';
          } else if (r > surface && r <= surface + 3) {
            type = 'dirt';
          } else if (r > surface + 3) {
            type = (Math.random() < 0.2) ? 'coal' : 'stone';
          }

          map[r][c] = type;

          const el = document.createElement('div');
          el.className = 'tile ' + type;
          el.id = 'cell-' + r + '-' + c;

          el.addEventListener('click', function (e) {
            const cur = map[r][c];

            if (e.shiftKey) {
              // 설치
              if (cur === 'air' && blocks > 0) {
                map[r][c] = 'dirt';
                el.className = 'tile dirt';
                blocks--;
                hud.innerText = blocks;
              }
            } else {
              // 채굴
              if (cur !== 'air') {
                map[r][c] = 'air';
                el.className = 'tile air';
                blocks++;
                hud.innerText = blocks;
              }
            }
          });

          grid.appendChild(el);
        }
      }
    })();
  </script>
</body>
</html>
