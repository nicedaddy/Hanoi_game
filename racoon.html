<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>너구리 점프 게임</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #gameWrapper {
      position: relative;
      display: inline-block;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      border: 3px solid #f1f5f9;
      background-color: #0b0f19;
    }
    #hud {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .guide {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="hud">Score: <span id="scoreText">0</span></div>
  </div>
  <div class="guide">조작: 방향키 [←][→] 이동, [↑][↓] 사다리, [Space] 점프</div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('scoreText');

      const GRAVITY = 0.65;
      let score = 0;
      let gameOver = false;
      let win = false;

      const keys = { left: false, right: false, up: false, down: false, space: false };

      // 플랫폼 (1: 발판, 2: 사다리)
      const platforms = [
        { x: 0, y: 560, w: 800, h: 40, type: 1 },
        { x: 60, y: 450, w: 680, h: 18, type: 1 },
        { x: 0, y: 340, w: 640, h: 18, type: 1 },
        { x: 160, y: 230, w: 640, h: 18, type: 1 },
        { x: 0, y: 120, w: 700, h: 18, type: 1 },

        // 사다리
        { x: 660, y: 450, w: 36, h: 110, type: 2 },
        { x: 100, y: 340, w: 36, h: 110, type: 2 },
        { x: 560, y: 230, w: 36, h: 110, type: 2 },
        { x: 220, y: 120, w: 36, h: 110, type: 2 }
      ];

      // 플레이어 (너구리)
      const player = {
        x: 40,
        y: 500,
        w: 28,
        h: 36,
        vx: 0,
        vy: 0,
        speed: 4,
        jump: -12.5,
        onGround: false,
        onLadder: false,
        climbing: false
      };

      // 아이템
      const items = [
        { x: 220, y: 530, w: 14, h: 14, collected: false },
        { x: 420, y: 420, w: 14, h: 14, collected: false },
        { x: 260, y: 310, w: 14, h: 14, collected: false },
        { x: 520, y: 200, w: 14, h: 14, collected: false },
        { x: 120, y: 90,  w: 14, h: 14, collected: false },
        { x: 500, y: 90,  w: 14, h: 14, collected: false }
      ];

      // 적 (장애물)
      const enemies = [
        { x: 260, y: 432, w: 26, h: 18, vx: 2, minX: 200, maxX: 450 },
        { x: 340, y: 212, w: 26, h: 18, vx: -2, minX: 240, maxX: 500 }
      ];

      window.addEventListener('keydown', (e) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
          e.preventDefault(); // 스크롤 방지
        }
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp') keys.up = true;
        if (e.key === 'ArrowDown') keys.down = true;
        if (e.key === ' ' || e.key === 'Spacebar') {
          if (player.onGround && !player.climbing) {
            player.vy = player.jump;
            player.onGround = false;
          }
        }
        if ((gameOver || win) && (e.key === 'r' || e.key === 'R')) {
          resetGame();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowUp') keys.up = false;
        if (e.key === 'ArrowDown') keys.down = false;
      });

      function checkOverlap(a, b) {
        return a.x < b.x + (b.w || b.width) &&
               a.x + (a.w || a.width) > b.x &&
               a.y < b.y + (b.h || b.height) &&
               a.y + (a.h || a.height) > b.y;
      }

      function resetGame() {
        score = 0;
        scoreEl.innerText = score;
        gameOver = false;
        win = false;
        player.x = 40;
        player.y = 500;
        player.vx = 0;
        player.vy = 0;
        items.forEach(i => i.collected = false);
      }

      function update() {
        if (gameOver || win) return;

        // 좌우 이동
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx = 0;

        // 사다리 충돌 감지
        player.onLadder = false;
        for (let p of platforms) {
          if (p.type === 2 && checkOverlap(player, p)) {
            player.onLadder = true;
            break;
          }
        }

        // 사다리 이동 로직
        if (player.onLadder) {
          if (keys.up) {
            player.vy = -player.speed * 0.7;
            player.climbing = true;
          } else if (keys.down) {
            player.vy = player.speed * 0.7;
            player.climbing = true;
          } else if (player.climbing) {
            player.vy = 0;
          }
        } else {
          player.climbing = false;
        }

        // 중력 가속도
        if (!player.climbing) {
          player.vy += GRAVITY;
        }

        player.x += player.vx;
        player.y += player.vy;

        // 화면 경계 제한
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

        // 플랫폼 바닥 충돌
        player.onGround = false;
        for (let p of platforms) {
          if (p.type === 1) {
            if (player.vy >= 0 &&
                player.x + player.w > p.x &&
                player.x < p.x + p.w &&
                player.y + player.h >= p.y &&
                player.y + player.h <= p.y + p.h + player.vy) {
              
              if (!keys.down || !player.onLadder) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.climbing = false;
              }
            }
          }
        }

        // 아이템 획득
        items.forEach(item => {
          if (!item.collected && checkOverlap(player, item)) {
            item.collected = true;
            score += 100;
            scoreEl.innerText = score;
          }
        });

        if (items.every(i => i.collected)) {
          win = true;
        }

        // 적 업데이트
        enemies.forEach(e => {
          e.x += e.vx;
          if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
          if (checkOverlap(player, e)) {
            gameOver = true;
          }
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 지형지물
        platforms.forEach(p => {
          if (p.type === 1) {
            ctx.fillStyle = '#475569';
            ctx.fillRect(p.x, p.y, p.w, p.h);
          } else {
            // 사다리
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
            for (let step = p.y + 12; step < p.y + p.h; step += 14) {
              ctx.beginPath();
              ctx.moveTo(p.x, step);
              ctx.lineTo(p.x + p.w, step);
              ctx.stroke();
            }
          }
        });

        // 아이템 (노란 보석)
        items.forEach(item => {
          if (!item.collected) {
            ctx.fillStyle = '#facc15';
            ctx.fillRect(item.x, item.y, item.w, item.h);
          }
        });

        // 장애물 (보라색 몬스터)
        enemies.forEach(e => {
          ctx.fillStyle = '#a855f7';
          ctx.fillRect(e.x, e.y, e.w, e.h);
        });

        // 플레이어 (오렌지색 너구리 캐릭터)
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // 눈 표시 (방향 식별용)
        ctx.fillStyle = '#fff';
        const eyeOffset = player.vx < 0 ? 4 : (player.w - 10);
        ctx.fillRect(player.x + eyeOffset, player.y + 8, 6, 6);

        // 상태 메시지
        if (gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 44px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '20px sans-serif';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText('[R] 키를 눌러 다시 시작', canvas.width / 2, canvas.height / 2 + 35);
        } else if (win) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#22c55e';
          ctx.font = 'bold 44px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('STAGE CLEAR!', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '20px sans-serif';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText('[R] 키를 눌러 재도전', canvas.width / 2, canvas.height / 2 + 35);
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // 렌더링 루프 시작
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
